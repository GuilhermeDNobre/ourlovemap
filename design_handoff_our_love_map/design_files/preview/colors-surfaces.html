<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Colors — Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--olm-bg); font-family: var(--font-sans); color: var(--fg-2); }
  .card { padding: 24px 28px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .swatch { border-radius: var(--r-md); overflow: hidden; box-shadow: var(--sh-sm); background: #fff; }
  .swatch .fill { height: 64px; }
  .swatch .meta { padding: 8px 12px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--fg-1); letter-spacing: -0.01em; }
  .hex { font-size: 11px; color: var(--fg-3); font-family: var(--font-mono); margin-top: 2px; }
  .border { box-shadow: inset 0 0 0 1px rgba(65,60,123,0.08), var(--sh-sm); }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="swatch border"><div class="fill" style="background:#FBF5F0"></div><div class="meta"><div class="name">Background</div><div class="hex">#FBF5F0</div></div></div>
      <div class="swatch border"><div class="fill" style="background:#FFFFFF"></div><div class="meta"><div class="name">Elevated</div><div class="hex">#FFFFFF</div></div></div>
      <div class="swatch"><div class="fill" style="background:#DBD9E1"></div><div class="meta"><div class="name">Surface</div><div class="hex">#DBD9E1</div></div></div>
      <div class="swatch"><div class="fill" style="background:#EDEBF0"></div><div class="meta"><div class="name">Surface soft</div><div class="hex">#EDEBF0</div></div></div>
    </div>
  </div>
</body>
</html>
