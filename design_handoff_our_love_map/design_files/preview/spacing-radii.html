<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--olm-bg); font-family: var(--font-sans); color: var(--fg-2); }
  .card { padding: 22px 28px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .ex { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 72px; background: linear-gradient(135deg, #FDDDDF, #EFDEFD); box-shadow: inset 0 0 0 1px rgba(65,60,123,0.08); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); font-weight: 600; }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="card">
    <div class="ex"><div class="box" style="border-radius:6px"></div><div class="name">--r-xs</div><div class="val">6px</div></div>
    <div class="ex"><div class="box" style="border-radius:10px"></div><div class="name">--r-sm</div><div class="val">10px</div></div>
    <div class="ex"><div class="box" style="border-radius:14px"></div><div class="name">--r-md</div><div class="val">14px</div></div>
    <div class="ex"><div class="box" style="border-radius:20px"></div><div class="name">--r-lg</div><div class="val">20px</div></div>
    <div class="ex"><div class="box" style="border-radius:28px"></div><div class="name">--r-xl</div><div class="val">28px</div></div>
    <div class="ex"><div class="box" style="border-radius:999px"></div><div class="name">--r-pill</div><div class="val">999px</div></div>
  </div>
</body>
</html>
