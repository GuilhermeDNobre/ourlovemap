<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Spacing — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--olm-bg); font-family: var(--font-sans); color: var(--fg-2); }
  .card { padding: 22px 28px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; gap: 12px; }
  .bar { height: 14px; background: linear-gradient(90deg, var(--olm-primary), var(--olm-accent)); border-radius: 999px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); font-weight: 600; }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); text-align: right; }
</style>
</head>
<body>
  <div class="card">
    <div class="row"><div class="name">--s-1</div><div class="bar" style="width:4px"></div><div class="val">4px</div></div>
    <div class="row"><div class="name">--s-2</div><div class="bar" style="width:8px"></div><div class="val">8px</div></div>
    <div class="row"><div class="name">--s-3</div><div class="bar" style="width:12px"></div><div class="val">12px</div></div>
    <div class="row"><div class="name">--s-4</div><div class="bar" style="width:16px"></div><div class="val">16px</div></div>
    <div class="row"><div class="name">--s-6</div><div class="bar" style="width:24px"></div><div class="val">24px</div></div>
    <div class="row"><div class="name">--s-8</div><div class="bar" style="width:32px"></div><div class="val">32px</div></div>
    <div class="row"><div class="name">--s-12</div><div class="bar" style="width:48px"></div><div class="val">48px</div></div>
    <div class="row"><div class="name">--s-16</div><div class="bar" style="width:64px"></div><div class="val">64px</div></div>
    <div class="row"><div class="name">--s-24</div><div class="bar" style="width:96px"></div><div class="val">96px</div></div>
  </div>
</body>
</html>
