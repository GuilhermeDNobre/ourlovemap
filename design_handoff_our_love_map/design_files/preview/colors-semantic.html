<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Colors — Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--olm-bg); font-family: var(--font-sans); color: var(--fg-2); }
  .card { padding: 24px 28px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .swatch { border-radius: var(--r-md); overflow: hidden; box-shadow: var(--sh-sm); background: #fff; }
  .swatch .fill { height: 68px; display: flex; align-items: center; gap: 8px; padding: 0 16px; color: #fff; font-weight: 600; font-size: 13px; letter-spacing: 0.02em; }
  .swatch .meta { padding: 8px 12px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--fg-1); }
  .hex { font-size: 11px; color: var(--fg-3); font-family: var(--font-mono); margin-top: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: #fff; }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="swatch"><div class="fill" style="background:#6FB58A"><span class="dot"></span>Success</div><div class="meta"><div class="name">Success</div><div class="hex">#6FB58A</div></div></div>
      <div class="swatch"><div class="fill" style="background:#E7B768"><span class="dot"></span>Warning</div><div class="meta"><div class="name">Warning</div><div class="hex">#E7B768</div></div></div>
      <div class="swatch"><div class="fill" style="background:#D85560"><span class="dot"></span>Error</div><div class="meta"><div class="name">Error</div><div class="hex">#D85560</div></div></div>
    </div>
  </div>
</body>
</html>
