<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--olm-bg); font-family: var(--font-sans); color: var(--fg-2); }
  .card { padding: 28px 32px; }
  .display { font-family: var(--font-serif); font-size: 56px; line-height: 1.05; letter-spacing: -0.02em; color: var(--olm-title); }
  em { font-style: italic; color: var(--olm-primary); }
  .meta { margin-top: 14px; font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="card">
    <div class="display">Sua <em>história</em> em um mapa.</div>
    <div class="meta">DM Serif Display · 56/58 · -0.02em · signature italic in primary</div>
  </div>
</body>
</html>
